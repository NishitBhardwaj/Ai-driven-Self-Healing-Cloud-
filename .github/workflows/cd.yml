name: CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      aws_region:
        description: "AWS Region (overrides secret)"
        required: false
        default: ""
        type: choice
        options:
          - us-east-1
          - us-west-2
          - ap-south-1
          - ca-central-1
          - eu-west-1
          - eu-central-1

env:
  AWS_ACCOUNT_ID: "365341398047"
  AWS_REGION_DEFAULT: ap-south-1
  ECR_REGISTRY: 365341398047.dkr.ecr.ap-south-1.amazonaws.com
  KUBERNETES_NAMESPACE: ai-cloud-${{ github.event.inputs.environment || 'staging' }}

jobs:
  # Install Monitoring CRDs
  install-monitoring-crds:
    name: Install Monitoring CRDs (ServiceMonitor / Prometheus Operator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Check if ServiceMonitor CRD exists
        id: crd_check
        run: |
          if kubectl get crd servicemonitors.monitoring.coreos.com >/dev/null 2>&1; then
            echo "crd_exists=true" >> $GITHUB_OUTPUT
          else
            echo "crd_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install ServiceMonitor CRDs if missing
        if: steps.crd_check.outputs.crd_exists == 'false'
        run: |
          echo "Installing Prometheus Operator CRDs..."
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_prometheuses.yaml
          kubectl apply --server-side -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_alertmanagers.yaml
          echo "CRDs installed successfully."

  # Deploy to Kubernetes
  deploy:
    needs: [install-monitoring-crds]
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event.inputs.environment || 'staging' }}
    outputs:
      namespace: ${{ env.KUBERNETES_NAMESPACE }}
      deployment_sha: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve AWS Region
        run: |
          # Prefer workflow input if provided, otherwise use secret
          INPUT_REGION='${{ github.event.inputs.aws_region }}'
          SECRET_REGION='${{ secrets.AWS_REGION }}'
          if [ -n "$INPUT_REGION" ]; then
            echo "Using region from workflow input: $INPUT_REGION"
            echo "AWS_REGION=$INPUT_REGION" >> $GITHUB_ENV
          else
            echo "Using region from secrets: $SECRET_REGION"
            echo "AWS_REGION=$SECRET_REGION" >> $GITHUB_ENV
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure kubectl for EKS
        run: |
          set -euo pipefail
          echo "Configuring kubectl for EKS cluster..."
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Test cluster access
        run: |
          set -e
          kubectl cluster-info
          kubectl get nodes
          kubectl version --client

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login --username AWS --password-stdin 365341398047.dkr.ecr.ap-south-1.amazonaws.com

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Generate go.sum
        run: |
          echo "Generating go.sum file..."
          go mod tidy
          go mod download
          go mod verify
          if [ -f "go.sum" ]; then
            echo "✓ go.sum generated successfully"
          else
            echo "✗ Failed to generate go.sum"
            exit 1
          fi

      # Login to Docker Hub BEFORE buildx to avoid 500 errors
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      # Pin Buildx version to avoid broken manifest issues and Docker Hub 500 errors
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.12.1
          driver-opts: |
            image=moby/buildkit:v0.12.5

      - name: Build Docker images
        run: |
          echo "Building all service images..."

          # Build self-healing
          docker build -t ai-cloud-self-healing:latest \
            -f docker/agents/self-healing/Dockerfile .

          # Build scaling
          docker build -t ai-cloud-scaling:latest \
            -f docker/agents/scaling/Dockerfile .

          # Build task-solving
          docker build -t ai-cloud-task-solving:latest \
            -f docker/agents/task-solving/Dockerfile .

          # Build performance-monitoring
          docker build -t ai-cloud-performance-monitoring:latest \
            -f docker/agents/performance-monitoring/Dockerfile .

          # Build coding
          docker build -t ai-cloud-coding:latest \
            -f docker/agents/coding/Dockerfile .

          # Build security
          docker build -t ai-cloud-security:latest \
            -f docker/agents/security/Dockerfile .

          # Build optimization
          docker build -t ai-cloud-optimization:latest \
            -f docker/agents/optimization/Dockerfile .

          echo "All images built successfully!"

      - name: Tag images for ECR
        run: |
          echo "Tagging images for ECR..."
          for img in coding scaling security self-healing optimization performance-monitoring task-solving; do
            echo "Tagging ai-cloud-$img:latest"
            docker tag ai-cloud-$img:latest \
              365341398047.dkr.ecr.ap-south-1.amazonaws.com/ai-cloud-$img:latest
            docker tag ai-cloud-$img:latest \
              365341398047.dkr.ecr.ap-south-1.amazonaws.com/ai-cloud-$img:${{ github.sha }}
          done

      - name: Push images to ECR
        run: |
          echo "Pushing images to ECR..."
          for img in coding scaling security self-healing optimization performance-monitoring task-solving; do
            echo "Pushing ai-cloud-$img"
            docker push 365341398047.dkr.ecr.ap-south-1.amazonaws.com/ai-cloud-$img:latest
            docker push 365341398047.dkr.ecr.ap-south-1.amazonaws.com/ai-cloud-$img:${{ github.sha }}
          done
          echo "All images pushed successfully!"

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.KUBERNETES_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify images exist in ECR
        run: |
          echo "Verifying all images exist in ECR..."
          for repo in ai-cloud-coding ai-cloud-scaling ai-cloud-security ai-cloud-self-healing ai-cloud-optimization ai-cloud-performance-monitoring ai-cloud-task-solving; do
            echo "Checking $repo..."
            aws ecr list-images --repository-name $repo --region ap-south-1 || echo "WARNING: No images found in $repo"
          done

      - name: Deploy with Helm
        id: helm_deploy
        run: |
          helm upgrade --install ai-cloud \
            kubernetes/helm/ai-cloud \
            --namespace ${{ env.KUBERNETES_NAMESPACE }} \
            --set global.imageRegistry=${{ env.ECR_REGISTRY }} \
            --set global.imageTag=${{ github.sha }} \
            --set environment=${{ github.event.inputs.environment || 'staging' }} \
            --create-namespace \
            --wait \
            --timeout 20m \
            --debug

      - name: Check pod status (debug)
        if: always()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.KUBERNETES_NAMESPACE }} -o wide || true
          echo ""
          echo "=== Describe Pods (for troubleshooting) ==="
          kubectl describe pods -n ${{ env.KUBERNETES_NAMESPACE }} || true

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/ai-cloud-self-healing -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/ai-cloud-scaling -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/ai-cloud-task-solving -n ${{ env.KUBERNETES_NAMESPACE }} --timeout=5m

      - name: Wait for pods to be ready
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/instance=ai-cloud \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --timeout=300s

      - name: Run smoke tests
        continue-on-error: false
        run: |
          echo "Running smoke tests..."

          # Test self-healing service
          kubectl run test-client-self-healing \
            --image=curlimages/curl \
            --restart=Never \
            --rm \
            --attach \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --command -- curl -f http://ai-cloud-self-healing:8080/health

          # Small delay to ensure pod cleanup
          sleep 5

          # Test scaling service
          kubectl run test-client-scaling \
            --image=curlimages/curl \
            --restart=Never \
            --rm \
            --attach \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --command -- curl -f http://ai-cloud-scaling:8080/health

  # Rollback on failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy]
    if: failure()
    env:
      KUBERNETES_NAMESPACE: ai-cloud-${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve AWS Region
        run: |
          # Prefer workflow input if provided, otherwise use secret
          INPUT_REGION='${{ github.event.inputs.aws_region }}'
          SECRET_REGION='${{ secrets.AWS_REGION }}'
          if [ -n "$INPUT_REGION" ]; then
            echo "Using region from workflow input: $INPUT_REGION"
            echo "AWS_REGION=$INPUT_REGION" >> $GITHUB_ENV
          else
            echo "Using region from secrets: $SECRET_REGION"
            echo "AWS_REGION=$SECRET_REGION" >> $GITHUB_ENV
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS (rollback)
        run: |
          set -euo pipefail
          echo "Configuring kubectl for EKS cluster (rollback)..."
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Test cluster access
        run: |
          set -e
          kubectl cluster-info
          kubectl get namespaces --no-headers || true

      - name: Rollback Helm release
        run: |
          echo "Rolling back Helm release..."
          helm rollback ai-cloud 0 \
            -n ${{ env.KUBERNETES_NAMESPACE }} \
            --wait \
            --timeout 5m || echo "Rollback failed or no previous release"

      - name: Notify team
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: "Deployment failed and was rolled back"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
